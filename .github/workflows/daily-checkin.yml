name: 雨云每日签到

on:
  # 定时触发 - 每天北京时间 8:15 执行 (UTC 0:15) - 避开 0:00 晚高峰
  schedule:
    - cron: '15 0 * * *'

  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安装中文字体并设置上海时区
      - name: 安装中文字体并设置上海时区
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei tzdata
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone > /dev/null

      # 3. 设置 Python 环境
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 4. 安装 Chrome 浏览器
      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 5. 安装 Python 依赖
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 缓存 Cookie (避免每日重复登录)
      - name: 缓存 Cookie
        uses: actions/cache@v4
        with:
          path: temp/cookies
          key: cookies-${{ github.run_id }}
          restore-keys: |
            cookies-

      # 7. 执行签到（内部会自动保存 stats/YYYY-MM/DD.json 并在推送中附上月统计）
      - name: 执行签到
        env:
          # 从 GitHub Secrets 读取账号密码
          RAINYUN_USERNAME: ${{ secrets.RAINYUN_USERNAME }}
          RAINYUN_PASSWORD: ${{ secrets.RAINYUN_PASSWORD }}
          # 可选：通知配置
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          # 运行配置
          RUN_MODE: 'once'  # 单次运行模式，执行完就退出
          DEBUG: 'false'
          MAX_DELAY: '1'
          TIMEOUT: '60000'
          CHECKIN_MAX_RETRIES: '0'
          # 2captcha API Key (可选，配置后使用2captcha破解验证码)
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          # 远程 YOLO 验证码 API（模型部署在 huasuanyun，配置后主链路走 API，未配置走本地降级）
          CAPTCHA_API_URL: ${{ secrets.CAPTCHA_API_URL }}
          CAPTCHA_API_TOKEN: ${{ secrets.CAPTCHA_API_TOKEN }}
          # 截图嵌入策略 (all / failed_only / none)
          SCREENSHOT_MODE: ${{ secrets.SCREENSHOT_MODE || 'failed_only' }}
        run: |
          python rainyun.py

      # 8. 将签到记录（stats/）与验证码样本归档提交回仓库
      - name: 提交签到记录与验证码样本
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 8.1 提交签到记录
          git add stats/

          # 8.2 提交验证码样本（长期保存，替代 30 天过期的 artifact）
          TODAY=$(date +%Y-%m-%d)
          MONTH=$(date +%Y-%m)
          SRC_DAY="logs/captcha_archive/${TODAY}"
          DEST="captcha_samples/${MONTH}/${TODAY}/${RUN_NUMBER}"
          if [ -d "${SRC_DAY}" ] && [ -n "$(find "${SRC_DAY}" -type f -name '*.jpg' 2>/dev/null | head -1)" ]; then
            mkdir -p "${DEST}"
            cp -r "${SRC_DAY}/." "${DEST}/"
            git add captcha_samples/
            echo "已归档验证码样本: ${DEST}"
          fi

          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "📊 签到记录与验证码样本: $(date +%Y-%m-%d) [skip ci]"
            git push
          fi

      # 9. 上传日志与截图（方便排查问题）
      - name: 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_number }}
          path: |
            logs/*.log
            logs/captcha_debug/
            temp/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # 10. 上传验证码图片归档（每次挑战的大图/图案/候选框，便于算法回归测试）
      #     若某天多次重试，可下载此 artifact 在本地用 script/captcha_compare.py 复现对比
      - name: 上传验证码图片归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-images-${{ github.run_number }}
          path: logs/captcha_archive/
          if-no-files-found: ignore
          retention-days: 30
